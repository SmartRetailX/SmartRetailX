apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-retail-x
  namespace: smart-retail-x
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
    - host: bi.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bi-dashboard-services-gateway
                port:
                  number: 3001
