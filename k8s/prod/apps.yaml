apiVersion: apps/v1
kind: Deployment
metadata:
  name: sinlama
  namespace: smart-retail-x
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sinlama
  template:
    metadata:
      labels:
        app: sinlama
    spec:
      containers:
        - name: sinlama
          image: smart-retail-x/sinlama-service:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sinlama
  namespace: smart-retail-x
spec:
  selector:
    app: sinlama
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smart-retail-x
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: smart-retail-x/api-gateway:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: smart-retail-x-config
            - secretRef:
                name: smart-retail-x-secrets
          readinessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smart-retail-x
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
---
