version: "3.9"

services:
  sinlama:
    image: ${SINLAMA_IMAGE:-ghcr.io/polyglotai/sinlama-api:latest}
    container_name: sinlama
    restart: unless-stopped
    ports:
      - "${SINLAMA_PORT:-8088}:8080"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  agent-service:
    build:
      context: ./apps/agent-service
      dockerfile: Dockerfile
    container_name: agent-service
    restart: unless-stopped
    ports:
      - "${AGENT_HTTP_PORT:-8010}:8010"
      - "${AGENT_TCP_PORT:-8877}:8877"
    environment:
      - AGENT_HTTP_PORT=8010
      - AGENT_TCP_HOST=0.0.0.0
      - AGENT_TCP_PORT=8877
      - WHISPER_API_URL=${WHISPER_API_URL}
      - WHISPER_API_TIMEOUT_MS=${WHISPER_API_TIMEOUT_MS:-180000}
      - WHISPER_API_UPLOAD_FIELD=${WHISPER_API_UPLOAD_FIELD:-file}
      - WHISPER_API_LANGUAGE_FIELD=${WHISPER_API_LANGUAGE_FIELD:-language}
      - WHISPER_API_RESPONSE_FIELD=${WHISPER_API_RESPONSE_FIELD:-transcription}
      - SINLAMA_API_URL=${SINLAMA_API_URL:-http://sinlama:8080/generate}
      - SINLAMA_API_KEY=${SINLAMA_API_KEY:-}
    depends_on:
      sinlama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
