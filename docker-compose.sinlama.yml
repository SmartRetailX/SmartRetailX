services:
  sinlama-service:
    build:
      context: ./apps/sinlama-service
      dockerfile: Dockerfile.remote
    image: sinlama-service:latest
    container_name: sinlama-service
    restart: unless-stopped
    environment:
      SINLAMA_HOST: ${SINLAMA_HOST:-0.0.0.0}
      SINLAMA_PORT: ${SINLAMA_PORT:-8080}
    ports:
      - "${SINLAMA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
